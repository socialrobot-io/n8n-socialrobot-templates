name: Validate templates

on:
  push:
    branches: [main]
    paths: ["workflows/**", "generate_templates.py", "annotate_templates.py", ".github/workflows/validate.yml"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate templates and check nothing drifts
        run: |
          python3 generate_templates.py
          python3 generate_descriptions.py
          # UUIDs (node ids, versionId, instanceId, webhookIds) are random per run;
          # normalize them before comparing so only real drift fails the check.
          norm() { python3 -c "
          import re, sys, hashlib
          def sub(m, counter=[0]):
              counter[0] += 1
              return f'UUID-{counter[0]}'
          print(re.sub(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', sub, open(sys.argv[1]).read()), end='')
          " "$1"; }
          failed=0
          for f in workflows/*.json; do
            if ! diff <(norm "$f") <(git show "HEAD:$f" 2>/dev/null | python3 -c "
          import re, sys
          def sub(m, counter=[0]):
              counter[0] += 1
              return f'UUID-{counter[0]}'
          print(re.sub(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', sub, sys.stdin.read()), end='')
          ") > /dev/null; then
              echo "::error::Real (non-UUID) drift in $f"
              failed=1
            fi
          done
          exit $failed

      - name: Validate workflow JSON structure
        run: |
          python3 - <<'EOF'
          import json, glob, os, sys

          NODE = "@socialrobot-io/n8n-nodes-socialrobot.socialRobot"
          PUBLISH_RESOURCES = {
              "instagram", "x", "linkedin", "tiktok", "facebook",
              "pinterest", "bluesky", "mastodon", "threads"}
          KNOWN_BASE = ("n8n-nodes-base.", "@n8n/n8n-nodes-langchain.")
          errors = []

          for fn in sorted(glob.glob("workflows/*.json")):
              base = os.path.basename(fn)
              wf = json.load(open(fn))
              names = {n["name"] for n in wf["nodes"]}
              # connection endpoints must exist
              for src, cd in wf["connections"].items():
                  if src not in names:
                      errors.append(f"{base}: orphan connection source '{src}'")
                  for ctype, outs in cd.items():
                      for arr in outs:
                          for c in arr:
                              if c["node"] not in names:
                                  errors.append(f"{base}: orphan connection target '{c['node']}'")
              # SocialRobot nodes must be well-formed
              for n in wf["nodes"]:
                  t = n.get("type", "")
                  if t == NODE:
                      p = n.get("parameters", {})
                      resource = p.get("resource")
                      if resource in PUBLISH_RESOURCES:
                          if "accountId" not in p or "publishMode" not in p:
                              errors.append(f"{base}: publish node '{n['name']}' missing accountId/publishMode")
                          if p.get("operation") != "create":
                              errors.append(f"{base}: publish node '{n['name']}' operation != create")
                          if resource == "bluesky" and "medias" in p:
                              errors.append(f"{base}: Bluesky is text-only but has medias")
                          if resource == "instagram" and p.get("mediaUrl") == "":
                              errors.append(f"{base}: Instagram has empty mediaUrl")
                          if resource == "instagram" and "medias" in p:
                              errors.append(f"{base}: Instagram must use flat media fields")
                      elif resource in ("post", "account"):
                          if "operation" not in p:
                              errors.append(f"{base}: management node '{n['name']}' missing operation")
                      else:
                          errors.append(f"{base}: SocialRobot node '{n['name']}' missing resource")
                  elif not t.startswith(KNOWN_BASE):
                      errors.append(f"{base}: unknown node type {t}")

          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print(f"All {len(glob.glob('workflows/*.json'))} templates valid.")
          EOF

      - name: Check every JSON parses
        run: for f in workflows/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done; echo "JSON OK"
